[project]
name = "tashih"
version = "0.1.0"
description = "Tashih (تصحيح) — Arabic hadith-verification service"
requires-python = ">=3.12"

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["docs", "data"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "ASYNC", "S", "SIM", "RUF"]
ignore = [
    "RUF001", "RUF002", "RUF003",  # Arabic text looks "ambiguous" to ruff
    "S101",                        # asserts are fine
    "B008",                        # FastAPI Depends()/Query() defaults
    "E501",                        # line length is left to the formatter (long Arabic strings)
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S", "ASYNC"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["app", "scripts"]
plugins = ["pydantic.mypy"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
markers = ["live: hits real external services (deselected by default)"]
addopts = "-m 'not live'"
